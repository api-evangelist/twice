description: Twice was an online marketplace for buying and selling secondhand clothing
  that operated at liketwice.com, and it appears on the Andreessen Horowitz (a16z)
  investment list. eBay acquired the Twice team in 2015 and the marketplace was shut
  down; liketwice.com now serves an HTTP 301 redirect to ebay.com (verified 2026-07-21)
  and no longer answers HTTPS. The company is catalogued in the API Evangelist network
  as a defunct a16z portfolio lead with no public API surface.
